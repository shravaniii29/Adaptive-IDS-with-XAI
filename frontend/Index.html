<!DOCTYPE html>
<html>
<head>
    <title>Network IDS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Network Intrusion Detection System</h1>

<div class="card">
    <h2>Prediction</h2>

    <p>Flow ID:
        <span id="flow"></span>
    </p>

    <p>Probability:
        <span id="prob"></span>
    </p>

    <p>XGBoost:
        <span id="xgb"></span>
    </p>

    <p>Isolation Forest:
        <span id="iso"></span>
    </p>

    <p>Hybrid:
        <span id="hybrid"></span>
    </p>
</div>

<div class="card">
    <h2>Drift Detection</h2>

    <p id="drift"></p>
</div>

<div class="card">
    <h2>System</h2>

    <p id="system"></p>
</div>

<div class="card">
    <h2>Top SHAP Features</h2>

    <ul id="shap"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
